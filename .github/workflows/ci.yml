name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developer_wiki_ci
          POSTGRES_USER: developer_wiki_ci
          POSTGRES_PASSWORD: ci-only-migration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developer_wiki_ci -d developer_wiki_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.9.0
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to a fresh PostgreSQL instance
        run: pnpm --filter @developer-wiki/api prisma:deploy
        env:
          DATABASE_URL: postgresql://developer_wiki_ci:ci-only-migration-password@127.0.0.1:5432/developer_wiki_ci?schema=public
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high
      - run: pnpm --filter @developer-wiki/api prisma:generate
      - run: pnpm --filter @developer-wiki/api test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:e2e
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser user journeys
        run: pnpm test:e2e

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t developer-wiki-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t developer-wiki-web:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: developer-wiki-api:ci
          version: v0.75.0
          severity: CRITICAL,HIGH
          timeout: 10m
          format: json
          output: trivy-api.json
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan web image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: developer-wiki-web:ci
          version: v0.75.0
          severity: CRITICAL,HIGH
          timeout: 10m
          format: json
          output: trivy-web.json
          exit-code: "1"
          ignore-unfixed: true
      - name: Summarize image scan findings
        if: always()
        run: |
          for report in trivy-api.json trivy-web.json; do
            if [[ ! -s "$report" ]]; then
              echo "::error title=Trivy diagnostics::$report was not produced"
              continue
            fi
            findings="$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "\(.Severity) \(.PkgName)@\(.InstalledVersion) \(.VulnerabilityID)"] | join("; ")' "$report")"
            if [[ -n "$findings" ]]; then
              echo "::error title=Trivy findings::$report: $findings"
            else
              echo "$report: no fixed CRITICAL/HIGH vulnerabilities"
            fi
          done

  production-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create temporary secret files
        run: |
          mkdir -p "$RUNNER_TEMP/developer-wiki-secrets"
          for secret in database-url jwt postgres minio grafana; do
            printf 'validation-only' > "$RUNNER_TEMP/developer-wiki-secrets/$secret"
          done
          printf 'ci-validation-jwt-secret-at-least-32-chars' > "$RUNNER_TEMP/developer-wiki-secrets/jwt"
      - name: Validate production Compose settings
        env:
          DEPLOY_ENV_FILE: ${{ runner.temp }}/developer-wiki-deploy.env
        run: |
          curl -fsSLo "$RUNNER_TEMP/alertmanager.tar.gz" "https://github.com/prometheus/alertmanager/releases/download/v0.34.1/alertmanager-0.34.1.linux-amd64.tar.gz"
          printf '265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8  %s\n' "$RUNNER_TEMP/alertmanager.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/alertmanager.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/alertmanager-0.34.1.linux-amd64:$PATH"
          amtool check-config "$PWD/infrastructure/monitoring/alertmanager.yml.example" --enable-feature=utf8-strict-mode
          bash -n scripts/backup-postgres-offsite.sh
          backup_unit="infrastructure/systemd/developer-wiki-backup.service"
          grep -qx 'User=developer-wiki-backup' "$backup_unit"
          grep -qx 'Group=docker' "$backup_unit"
          grep -qx 'ExecStart=/usr/bin/bash /opt/developer-wiki/scripts/backup-postgres-offsite.sh' "$backup_unit"
          grep -qx 'CapabilityBoundingSet=' "$backup_unit"
          grep -qx 'AmbientCapabilities=' infrastructure/systemd/developer-wiki-backup.service
          grep -qx 'RestrictSUIDSGID=true' infrastructure/systemd/developer-wiki-backup.service
          grep -qx 'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6' "$backup_unit"
          backup_timer="infrastructure/systemd/developer-wiki-backup.timer"
          grep -qx 'OnCalendar=*-*-* 02:15:00' "$backup_timer"
          grep -qx 'RandomizedDelaySec=30m' "$backup_timer"
          grep -qx 'Persistent=true' "$backup_timer"
          grep -qx 'Unit=developer-wiki-backup.service' "$backup_timer"
          backup_calendar="$(sed -n 's/^OnCalendar=//p' "$backup_timer")"
          systemd-analyze calendar "$backup_calendar" >/dev/null
          touch "$RUNNER_TEMP/backup-validation.env"
          sed -e "s|^WorkingDirectory=.*|WorkingDirectory=$GITHUB_WORKSPACE|" \
            -e "s|^EnvironmentFile=.*|EnvironmentFile=$RUNNER_TEMP/backup-validation.env|" \
            -e "s|^ExecStart=.*|ExecStart=/usr/bin/bash $GITHUB_WORKSPACE/scripts/backup-postgres-offsite.sh|" \
            -e '/^User=/d' -e '/^Group=/d' "$backup_unit" > "$RUNNER_TEMP/developer-wiki-backup.service"
          systemd-analyze verify "$RUNNER_TEMP/developer-wiki-backup.service"
          for backup_uri in "s3:///missing-bucket" "https://example.invalid/backups" "s3://bucket/path with-space"; do
            if DEPLOY_ENV_FILE="$RUNNER_TEMP/backup-validation.env" BACKUP_S3_URI="$backup_uri" AGE_RECIPIENT=age1fixture bash scripts/backup-postgres-offsite.sh; then
              echo "Backup script accepted invalid destination: $backup_uri" >&2
              exit 1
            fi
          done
          backup_mock_bin="$RUNNER_TEMP/backup-mock-bin"
          mkdir -p "$backup_mock_bin"
          cat > "$backup_mock_bin/docker" <<'EOF'
          #!/usr/bin/env bash
          printf 'mock postgres dump\n'
          EOF
          cat > "$backup_mock_bin/age" <<'EOF'
          #!/usr/bin/env bash
          output=""
          while (($#)); do
            if [[ "$1" == "--output" ]]; then output="$2"; shift 2; else shift; fi
          done
          cat > "$output"
          EOF
          cat > "$backup_mock_bin/aws" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1 $2" == "s3 cp" ]]; then
            source="$3"
            destination="$4"
            size="$(wc -c < "$source" | tr -d '[:space:]')"
            printf '%s\t%s\n' "${destination#s3://}" "$size" >> "$AWS_MOCK_STATE"
            exit 0
          fi
          if [[ "$1 $2" == "s3api head-object" ]]; then
            shift 2
            bucket=""
            key=""
            while (($#)); do
              case "$1" in
                --bucket) bucket="$2"; shift 2 ;;
                --key) key="$2"; shift 2 ;;
                *) shift ;;
              esac
            done
            if [[ "${AWS_MOCK_SIZE_MODE:-}" == "mismatch" ]]; then
              printf '1\n'
              exit 0
            fi
            awk -F '\t' -v object="$bucket/$key" '$1 == object { size=$2 } END { if (size == "") exit 1; print size }' "$AWS_MOCK_STATE"
            exit 0
          fi
          echo "Unexpected AWS mock command" >&2
          exit 1
          EOF
          chmod +x "$backup_mock_bin/docker" "$backup_mock_bin/age" "$backup_mock_bin/aws"
          : > "$RUNNER_TEMP/backup-objects.tsv"
          touch "$RUNNER_TEMP/backup-run.env"
          PATH="$backup_mock_bin:$PATH" DEPLOY_ENV_FILE="$RUNNER_TEMP/backup-run.env" BACKUP_S3_URI=s3://fixture-bucket/developer-wiki AGE_RECIPIENT=age1fixture AWS_MOCK_STATE="$RUNNER_TEMP/backup-objects.tsv" bash scripts/backup-postgres-offsite.sh > "$RUNNER_TEMP/backup-success.log"
          grep -Fq "Encrypted PostgreSQL backup uploaded:" "$RUNNER_TEMP/backup-success.log"
          : > "$RUNNER_TEMP/backup-objects.tsv"
          if output="$(PATH="$backup_mock_bin:$PATH" DEPLOY_ENV_FILE="$RUNNER_TEMP/backup-run.env" BACKUP_S3_URI=s3://fixture-bucket/developer-wiki AGE_RECIPIENT=age1fixture AWS_MOCK_STATE="$RUNNER_TEMP/backup-objects.tsv" AWS_MOCK_SIZE_MODE=mismatch bash scripts/backup-postgres-offsite.sh 2>&1)"; then
            echo "Backup script accepted an uploaded object with a mismatched size" >&2
            exit 1
          fi
          if [[ "$output" != *"size mismatch"* ]]; then
            echo "Backup size mismatch failed without the expected diagnostic" >&2
            exit 1
          fi
          bash -n scripts/validate-production-config.sh
          bash -n scripts/smoke-deployment.sh
          while IFS='=' read -r key value; do
            if [[ "$key" == *_IMAGE && ! "$value" =~ @sha256:[a-f0-9]{64}$ ]]; then
              echo "Production example image is not pinned by sha256 digest: $key" >&2
              exit 1
            fi
          done < <(grep -E '^[A-Z_]+_IMAGE=' .env.production.example)
          public_ports_ok='{"services":{"caddy":{"ports":[{"target":80,"published":"80","protocol":"tcp"},{"target":443,"published":"443","protocol":"tcp"},{"target":443,"published":"443","protocol":"udp"}]},"api":{}}}'
          ops_loopback_ok='{"services":{"caddy":{"ports":[{"target":80,"published":"80","protocol":"tcp"},{"target":443,"published":"443","protocol":"tcp"},{"target":443,"published":"443","protocol":"udp"}]},"grafana":{"ports":[{"target":3000,"published":"3002","protocol":"tcp","host_ip":"127.0.0.1"}]}}}'
          public_api_port='{"services":{"caddy":{"ports":[{"target":80,"published":"80","protocol":"tcp"},{"target":443,"published":"443","protocol":"tcp"},{"target":443,"published":"443","protocol":"udp"}]},"api":{"ports":[{"target":3001,"published":"3001","protocol":"tcp","host_ip":"0.0.0.0"}]}}}'
          caddy_alternate_public_port='{"services":{"caddy":{"ports":[{"target":80,"published":"8080","protocol":"tcp"},{"target":443,"published":"443","protocol":"tcp"},{"target":443,"published":"443","protocol":"udp"}]},"api":{}}}'
          jq -e -f scripts/production-compose-ports.jq <<<"$public_ports_ok" >/dev/null
          jq -e -f scripts/production-compose-ports.jq <<<"$ops_loopback_ok" >/dev/null
          if jq -e -f scripts/production-compose-ports.jq <<<"$public_api_port" >/dev/null; then
            echo "Port policy accepted a public API port" >&2
            exit 1
          fi
          if jq -e -f scripts/production-compose-ports.jq <<<"$caddy_alternate_public_port" >/dev/null; then
            echo "Port policy accepted an alternate public Caddy host port" >&2
            exit 1
          fi
          image_digest="sha256:$(printf '0%.0s' {1..64})"
          cat > "$DEPLOY_ENV_FILE" <<EOF
          SITE_ADDRESS=wiki.example.test
          WEB_IMAGE=example/web@${image_digest}
          API_IMAGE=example/api@${image_digest}
          CADDY_IMAGE=caddy@${image_digest}
          POSTGRES_IMAGE=postgres@${image_digest}
          REDIS_IMAGE=redis@${image_digest}
          MINIO_IMAGE=minio@${image_digest}
          PROMETHEUS_IMAGE=prometheus@${image_digest}
          GRAFANA_IMAGE=grafana@${image_digest}
          MINIO_ROOT_USER=wiki-root
          DATABASE_URL_SECRET_FILE=$RUNNER_TEMP/developer-wiki-secrets/database-url
          JWT_SECRET_FILE=$RUNNER_TEMP/developer-wiki-secrets/jwt
          POSTGRES_PASSWORD_FILE=$RUNNER_TEMP/developer-wiki-secrets/postgres
          MINIO_ROOT_PASSWORD_FILE=$RUNNER_TEMP/developer-wiki-secrets/minio
          GRAFANA_ADMIN_PASSWORD_FILE=$RUNNER_TEMP/developer-wiki-secrets/grafana
          EOF
          printf 'too-short' > "$RUNNER_TEMP/developer-wiki-secrets/jwt"
          if bash scripts/validate-production-config.sh; then
            echo "Production config accepted a JWT secret shorter than 32 characters" >&2
            exit 1
          fi
          printf '   too-short   ' > "$RUNNER_TEMP/developer-wiki-secrets/jwt"
          if bash scripts/validate-production-config.sh; then
            echo "Production config accepted a short JWT secret padded with whitespace" >&2
            exit 1
          fi
          printf 'replace-this-is-a-placeholder-with-enough-length-0000' > "$RUNNER_TEMP/developer-wiki-secrets/jwt"
          if bash scripts/validate-production-config.sh; then
            echo "Production config accepted a placeholder JWT secret" >&2
            exit 1
          fi
          printf 'local-development-secret-change-this-32-chars-minimum' > "$RUNNER_TEMP/developer-wiki-secrets/jwt"
          if bash scripts/validate-production-config.sh; then
            echo "Production config accepted the local development JWT default" >&2
            exit 1
          fi
          printf 'ci-validation-jwt-secret-at-least-32-chars' > "$RUNNER_TEMP/developer-wiki-secrets/jwt"
          assert_config_rejects() {
            local env_file="$1" expected="$2" forbidden="${3:-validation-only}" output
            if output="$(DEPLOY_ENV_FILE="$env_file" bash scripts/validate-production-config.sh 2>&1)"; then
              echo "Production config accepted invalid secret file setup: $expected" >&2
              exit 1
            fi
            if [[ "$output" != *"$expected"* || "$output" == *"$forbidden"* ]]; then
              echo "Secret preflight error was missing its field name or exposed file content" >&2
              exit 1
            fi
          }
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/missing-secret.env"
          printf 'DATABASE_URL_SECRET_FILE=%s\n' "$RUNNER_TEMP/does-not-exist" >> "$RUNNER_TEMP/missing-secret.env"
          assert_config_rejects "$RUNNER_TEMP/missing-secret.env" DATABASE_URL_SECRET_FILE
          touch "$RUNNER_TEMP/empty-secret"
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/empty-secret.env"
          printf 'POSTGRES_PASSWORD_FILE=%s\n' "$RUNNER_TEMP/empty-secret" >> "$RUNNER_TEMP/empty-secret.env"
          assert_config_rejects "$RUNNER_TEMP/empty-secret.env" POSTGRES_PASSWORD_FILE
          mkdir -p "$RUNNER_TEMP/secret-directory"
          assert_config_rejects "$RUNNER_TEMP/secret-directory" "Cannot read deployment env file"
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/directory-secret.env"
          printf 'MINIO_ROOT_PASSWORD_FILE=%s\n' "$RUNNER_TEMP/secret-directory" >> "$RUNNER_TEMP/directory-secret.env"
          assert_config_rejects "$RUNNER_TEMP/directory-secret.env" MINIO_ROOT_PASSWORD_FILE
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/missing-jwt-path.env"
          printf 'JWT_SECRET_FILE=\n' >> "$RUNNER_TEMP/missing-jwt-path.env"
          assert_config_rejects "$RUNNER_TEMP/missing-jwt-path.env" JWT_SECRET_FILE
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/invalid-image.env"
          printf 'WEB_IMAGE=registry.example/private/DO-NOT-PRINT@bad-digest\n' >> "$RUNNER_TEMP/invalid-image.env"
          assert_config_rejects "$RUNNER_TEMP/invalid-image.env" WEB_IMAGE DO-NOT-PRINT
          bash scripts/validate-production-config.sh
          sed 's#alerts.example.invalid/replace-with-approved-webhook#alerts.example.test/webhook#' infrastructure/monitoring/alertmanager.yml.example > "$RUNNER_TEMP/developer-wiki-secrets/alertmanager.yml"
          cat >> "$DEPLOY_ENV_FILE" <<EOF
          ENABLE_ALERTMANAGER=true
          ENABLE_OPS_UI=true
          ALERTMANAGER_IMAGE=alertmanager@${image_digest}
          ALERTMANAGER_CONFIG_FILE=$RUNNER_TEMP/developer-wiki-secrets/alertmanager.yml
          EOF
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/missing-alertmanager.env"
          printf 'ALERTMANAGER_CONFIG_FILE=%s\n' "$RUNNER_TEMP/does-not-exist" >> "$RUNNER_TEMP/missing-alertmanager.env"
          assert_config_rejects "$RUNNER_TEMP/missing-alertmanager.env" ALERTMANAGER_CONFIG_FILE
          touch "$RUNNER_TEMP/empty-alertmanager.yml"
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/empty-alertmanager.env"
          printf 'ALERTMANAGER_CONFIG_FILE=%s\n' "$RUNNER_TEMP/empty-alertmanager.yml" >> "$RUNNER_TEMP/empty-alertmanager.env"
          assert_config_rejects "$RUNNER_TEMP/empty-alertmanager.env" ALERTMANAGER_CONFIG_FILE
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/directory-alertmanager.env"
          printf 'ALERTMANAGER_CONFIG_FILE=%s\n' "$RUNNER_TEMP/secret-directory" >> "$RUNNER_TEMP/directory-alertmanager.env"
          assert_config_rejects "$RUNNER_TEMP/directory-alertmanager.env" ALERTMANAGER_CONFIG_FILE
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/reserved-alertmanager.env"
          printf 'ALERTMANAGER_CONFIG_FILE=%s\n' "$PWD/infrastructure/monitoring/alertmanager.yml.example" >> "$RUNNER_TEMP/reserved-alertmanager.env"
          assert_config_rejects "$RUNNER_TEMP/reserved-alertmanager.env" ALERTMANAGER_CONFIG_FILE
          printf 'route: [\n' > "$RUNNER_TEMP/invalid-alertmanager.yml"
          cp "$DEPLOY_ENV_FILE" "$RUNNER_TEMP/invalid-alertmanager.env"
          printf 'ALERTMANAGER_CONFIG_FILE=%s\n' "$RUNNER_TEMP/invalid-alertmanager.yml" >> "$RUNNER_TEMP/invalid-alertmanager.env"
          assert_config_rejects "$RUNNER_TEMP/invalid-alertmanager.env" ALERTMANAGER_CONFIG_FILE
          bash scripts/validate-production-config.sh
          smoke_bin="$RUNNER_TEMP/smoke-bin"
          mkdir -p "$smoke_bin"
          cat > "$smoke_bin/curl" <<'EOF'
          #!/usr/bin/env bash
          case "$*" in
            *--dump-header*)
              printf 'HTTP/2 200\r\nStrict-Transport-Security: max-age=31536000\r\nX-Content-Type-Options: nosniff\r\nX-Frame-Options: DENY\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nPermissions-Policy: camera=(), microphone=(), geolocation=()\r\n'
              ;;
            *--write-out*'/api/v1/auth/me'*) printf '401' ;;
            *--write-out*) printf '200' ;;
          esac
          EOF
          cat > "$smoke_bin/docker" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$*" > "$DOCKER_ARGS_FILE"
          EOF
          chmod +x "$smoke_bin/curl" "$smoke_bin/docker"
          smoke_env="$RUNNER_TEMP/smoke.env"
          touch "$smoke_env"
          PATH="$smoke_bin:$PATH" SITE_URL=https://wiki.example.test DEPLOY_ENV_FILE="$smoke_env" DOCKER_ARGS_FILE="$RUNNER_TEMP/default-compose-args" bash scripts/smoke-deployment.sh
          if grep -Eq 'compose\.(ops-access|alertmanager)\.yaml' "$RUNNER_TEMP/default-compose-args"; then
            echo "Default smoke unexpectedly enabled an optional Compose overlay" >&2
            exit 1
          fi
          printf 'ENABLE_OPS_UI=true\nENABLE_ALERTMANAGER=true\n' > "$smoke_env"
          PATH="$smoke_bin:$PATH" SITE_URL=https://wiki.example.test DEPLOY_ENV_FILE="$smoke_env" DOCKER_ARGS_FILE="$RUNNER_TEMP/overlay-compose-args" bash scripts/smoke-deployment.sh
          grep -Fq "$PWD/infrastructure/docker/compose.ops-access.yaml" "$RUNNER_TEMP/overlay-compose-args"
          grep -Fq "$PWD/infrastructure/docker/compose.alertmanager.yaml" "$RUNNER_TEMP/overlay-compose-args"

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Prometheus config and alert rules
        run: |
          for config in prometheus.yml prometheus.alertmanager.yml; do
            docker run --rm --entrypoint=/bin/promtool \
              -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" \
              prom/prometheus:v3.7.3 \
              check config "/etc/prometheus/$config"
          done
          jq -e '
            .uid == "developer-wiki-api" and
            (.panels | length == 4) and
            ([.panels[].title] | sort) == ["API 5xx error rate", "API mean request latency", "API status", "Scrape targets"] and
            all(.panels[]; all(.targets[]; (.expr | type == "string" and length > 0)))
          ' infrastructure/monitoring/grafana/provisioning/dashboards/developer-wiki.json >/dev/null
          grep -Fq 'url: http://prometheus:9090' infrastructure/monitoring/grafana/provisioning/datasources/prometheus.yml
          grep -Fq 'path: /etc/grafana/provisioning/dashboards' infrastructure/monitoring/grafana/provisioning/dashboards/provider.yml
