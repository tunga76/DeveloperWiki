name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high
      - run: pnpm --filter @developer-wiki/api prisma:generate
      - run: pnpm --filter @developer-wiki/api test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t developer-wiki-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t developer-wiki-web:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: developer-wiki-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: developer-wiki-web:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
