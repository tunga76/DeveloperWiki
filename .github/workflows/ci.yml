name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.9.0
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high
      - run: pnpm --filter @developer-wiki/api prisma:generate
      - run: pnpm --filter @developer-wiki/api test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:e2e
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser user journeys
        run: pnpm test:e2e

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t developer-wiki-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t developer-wiki-web:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: developer-wiki-api:ci
          version: 0.75.0
          severity: CRITICAL,HIGH
          timeout: 10m
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: developer-wiki-web:ci
          version: 0.75.0
          severity: CRITICAL,HIGH
          timeout: 10m
          exit-code: "1"
          ignore-unfixed: true

  production-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create temporary secret files
        run: |
          mkdir -p "$RUNNER_TEMP/developer-wiki-secrets"
          for secret in database-url jwt postgres minio grafana; do
            printf 'validation-only' > "$RUNNER_TEMP/developer-wiki-secrets/$secret"
          done
      - name: Validate production Compose settings
        env:
          DEPLOY_ENV_FILE: ${{ runner.temp }}/developer-wiki-deploy.env
        run: |
          bash -n scripts/backup-postgres-offsite.sh
          image_digest="sha256:$(printf '0%.0s' {1..64})"
          cat > "$DEPLOY_ENV_FILE" <<EOF
          SITE_ADDRESS=wiki.example.test
          WEB_IMAGE=example/web@${image_digest}
          API_IMAGE=example/api@${image_digest}
          CADDY_IMAGE=caddy@${image_digest}
          POSTGRES_IMAGE=postgres@${image_digest}
          REDIS_IMAGE=redis@${image_digest}
          MINIO_IMAGE=minio@${image_digest}
          PROMETHEUS_IMAGE=prometheus@${image_digest}
          GRAFANA_IMAGE=grafana@${image_digest}
          MINIO_ROOT_USER=wiki-root
          DATABASE_URL_SECRET_FILE=$RUNNER_TEMP/developer-wiki-secrets/database-url
          JWT_SECRET_FILE=$RUNNER_TEMP/developer-wiki-secrets/jwt
          POSTGRES_PASSWORD_FILE=$RUNNER_TEMP/developer-wiki-secrets/postgres
          MINIO_ROOT_PASSWORD_FILE=$RUNNER_TEMP/developer-wiki-secrets/minio
          GRAFANA_ADMIN_PASSWORD_FILE=$RUNNER_TEMP/developer-wiki-secrets/grafana
          EOF
          bash scripts/validate-production-config.sh
          cp infrastructure/monitoring/alertmanager.yml.example "$RUNNER_TEMP/developer-wiki-secrets/alertmanager.yml"
          cat >> "$DEPLOY_ENV_FILE" <<EOF
          ENABLE_ALERTMANAGER=true
          ENABLE_OPS_UI=true
          ALERTMANAGER_IMAGE=alertmanager@${image_digest}
          ALERTMANAGER_CONFIG_FILE=$RUNNER_TEMP/developer-wiki-secrets/alertmanager.yml
          EOF
          bash scripts/validate-production-config.sh

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Prometheus config and alert rules
        run: |
          for config in prometheus.yml prometheus.alertmanager.yml; do
            docker run --rm --entrypoint=/bin/promtool \
              -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" \
              prom/prometheus:v3.7.3 \
              check config "/etc/prometheus/$config"
          done
